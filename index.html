<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学数学知识图谱 · 1~6年级</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1d2129; --sub:#6b7280; --line:#e5e7eb;
    --num:#3d6fe8; --num-bg:#eef3fe;
    --geo:#e07b2a; --geo-bg:#fdf1e6;
    --stat:#2e9e5b; --stat-bg:#e9f7ef;
    --prac:#8a63d2; --prac-bg:#f3eefc;
    --up:#d9820b; --down:#2f6bff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    background:rgba(255,255,255,.92); backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line); padding:10px 18px 9px;
  }
  .hrow{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  h1{font-size:17px; margin:0; letter-spacing:.5px;}
  .sub{font-size:12px; color:var(--sub); margin:3px 0 0;}
  .progress-block{margin-left:auto; text-align:right; min-width:150px;}
  .ptext{font-size:12px; color:var(--sub); display:flex; align-items:center; gap:8px; justify-content:flex-end;}
  #pl{font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600;}
  .linkbtn{border:0; background:none; color:#9aa1ac; font-size:11px; cursor:pointer; padding:0;}
  .linkbtn:hover{color:#e05252;}
  .pbar{width:140px; height:5px; background:#eceef2; border-radius:3px; margin-top:5px; overflow:hidden; margin-left:auto;}
  #pfill{height:100%; width:0%; background:linear-gradient(90deg,#37b26f,#34c759); border-radius:3px; transition:width .3s;}
  .controls{display:flex; align-items:center; gap:10px; margin-top:9px; flex-wrap:wrap;}
  .searchbox{
    display:flex; align-items:center; gap:6px; background:#f1f2f5; border:1px solid transparent;
    border-radius:8px; padding:5px 10px; min-width:230px;
  }
  .searchbox:focus-within{background:#fff; border-color:#c9d4ea;}
  .searchbox svg{flex:none; opacity:.45;}
  #q{border:0; outline:0; background:none; font-size:13px; width:170px; font-family:inherit;}
  #qcount{font-size:11px; color:var(--sub); white-space:nowrap;}
  .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .chip{
    font-size:12px; padding:4.5px 11px; border-radius:999px; cursor:pointer; user-select:none;
    background:#fff; border:1px solid var(--line); color:#3c4350; transition:all .15s; display:flex; align-items:center; gap:5px;
  }
  .chip:hover{border-color:#c4cad4;}
  .chip.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  .chip .cdot{width:8px;height:8px;border-radius:50%; flex:none;}
  .chip.on .cdot{outline:2px solid rgba(255,255,255,.35);}
  main{position:fixed; inset:0; top:0;}
  #graph{width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
  #graph.panning{cursor:grabbing;}
  #hint{
    position:absolute; top:118px; left:16px; z-index:5; pointer-events:none;
    font-size:12px; color:#5b6270; background:rgba(255,255,255,.85); border:1px solid var(--line);
    padding:6px 12px; border-radius:999px; backdrop-filter:blur(6px);
  }
  .zoombtns{position:absolute; left:14px; bottom:16px; z-index:5; display:flex; flex-direction:column; gap:6px;}
  .zoombtns button{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:#fff;
    font-size:16px; color:#3c4350; cursor:pointer; box-shadow:0 1px 4px rgba(20,25,40,.08);
  }
  .zoombtns button:hover{background:#f4f5f8;}
  /* ---------- SVG graph ---------- */
  .edge{fill:none; stroke:#c9d1dd; stroke-width:1.3; opacity:.5; transition:opacity .25s, stroke .25s, stroke-width .25s;}
  .edge.dim{opacity:.05;}
  .edge.fade{opacity:.05;}
  .edge.up{stroke:var(--up); stroke-width:2.4; opacity:.95;}
  .edge.down{stroke:var(--down); stroke-width:2.2; opacity:.92;}
  .node{cursor:pointer; transition:opacity .25s;}
  .node rect{transition:stroke-width .15s, filter .15s;}
  .node.dim{opacity:.1;}
  .node.fade{opacity:.2;}
  .node.up, .node.down{opacity:1;}
  .node.sel rect{stroke-width:2.6; filter:drop-shadow(0 2px 6px rgba(29,33,41,.22));}
  .node text{font-family:inherit; pointer-events:none;}
  .nlabel{fill:#22262e;}
  .band{fill:#e9ecf1;}
  .bandtxt{fill:#575e6b; font-size:14px; font-weight:600; letter-spacing:1px;}
  .semtxt{fill:#8a919e; font-size:11px;}
  .stripe{fill:#f7f9fc;}
  /* ---------- detail panel ---------- */
  #panel{
    position:fixed; top:0; right:0; bottom:0; width:min(348px,92vw); z-index:30;
    background:#fff; border-left:1px solid var(--line); box-shadow:-8px 0 30px rgba(20,25,40,.08);
    transform:translateX(105%); transition:transform .28s cubic-bezier(.3,.8,.3,1);
    padding:20px 22px 26px; overflow-y:auto;
  }
  #panel.open{transform:translateX(0);}
  #pclose{
    position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%;
    border:0; background:#f1f2f5; color:#5b6270; font-size:13px; cursor:pointer;
  }
  #pclose:hover{background:#e6e8ee;}
  #ptags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:9px; padding-right:34px;}
  .tag{font-size:11px; padding:3px 9px; border-radius:6px; font-weight:500;}
  #pname{font-size:20px; margin:2px 0 10px; letter-spacing:.3px; padding-right:10px;}
  #pdesc{font-size:13.5px; line-height:1.75; color:#3a4150; margin:0 0 14px;}
  .tipbox{
    background:#fdf6e3; border:1px solid #f0e3bb; border-radius:10px;
    padding:10px 13px; font-size:12.5px; line-height:1.7; color:#6d5b1e; margin:0 0 16px;
  }
  .tipbox b{color:#8a6d1a;}
  .sec{margin-bottom:15px;}
  .sec h3{
    font-size:12px; margin:0 0 8px; color:#5b6270; font-weight:600;
    display:flex; align-items:center; gap:6px; letter-spacing:.5px;
  }
  .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .dot.up{background:var(--up);} .dot.down{background:var(--down);}
  .chiplist{display:flex; flex-wrap:wrap; gap:6px;}
  .kchip{
    display:flex; align-items:center; gap:6px; font-size:12px; padding:5px 10px;
    background:#f6f7f9; border:1px solid var(--line); border-radius:8px; cursor:pointer;
  }
  .kchip:hover{border-color:#b9c1ce; background:#fff;}
  .kchip .kdot{width:7px; height:7px; border-radius:50%;}
  .kchip small{color:#9aa1ac; font-size:10.5px;}
  .none{font-size:12px; color:#9aa1ac;}
  #plearn{
    width:100%; padding:10px 0; border-radius:10px; font-size:13.5px; cursor:pointer;
    border:1.5px solid #c9ead6; background:#f0faf4; color:#1f7a47; font-weight:600; margin-top:4px;
    transition:all .15s;
  }
  #plearn:hover{background:#e4f5ec;}
  #plearn.done{background:#2e9e5b; border-color:#2e9e5b; color:#fff;}
  #punlearn{
    width:100%; margin-top:8px; padding:8px 0; border-radius:10px; font-size:12px; cursor:pointer;
    border:1px solid var(--line); background:none; color:#9aa1ac;
  }
  #punlearn:hover{color:#c0564f; border-color:#e5c2bf;}
  .learnhint{font-size:11px; color:#9aa1ac; text-align:center; margin:8px 0 0;}
  .panelnote{font-size:11px; color:#b0b6c0; margin-top:18px; line-height:1.6;}
  /* ---------- 掌握小测 ---------- */
  .quizhead{display:flex; justify-content:space-between; align-items:center; margin:2px 0 12px;}
  .quizhead .qt{font-size:12px; color:#5b6270; font-weight:600; letter-spacing:.5px;}
  .qprog{font-variant-numeric:tabular-nums; font-size:12px; color:#9aa1ac;}
  .qtext{font-size:15.5px; line-height:1.6; margin:0 0 14px; color:var(--ink);}
  .qopts{display:flex; flex-direction:column; gap:8px;}
  .qopt{
    padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#f8f9fb;
    font-size:14px; cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); transition:all .12s;
  }
  .qopt:hover{border-color:#b9c1ce; background:#fff;}
  .qopt.right{background:#e9f7ef; border-color:#2e9e5b; color:#1f7a47; font-weight:600;}
  .qopt.wrong{background:#fdeeee; border-color:#d9534f; color:#a12622;}
  .qfeed{min-height:36px; display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .qfeed .ok{color:#1f7a47; font-size:13px; font-weight:600;}
  .qfeed .no{color:#a12622; font-size:13px; font-weight:600;}
  .retrybtn{border:0; background:var(--ink); color:#fff; border-radius:8px; padding:7px 14px; font-size:12.5px; cursor:pointer;}
  .linkbtn.spot{color:#2e9e5b; font-weight:600;}
  .linkbtn.spot:hover{color:#1f7a47;}
  .spotfrom{font-size:11.5px; color:#9aa1ac; margin:-6px 0 12px;}
  .warnbox{
    margin:10px 0 2px; padding:9px 12px; border-radius:9px; font-size:12.5px; line-height:1.6;
    background:#fdf3e7; border:1px solid #f5ddb8; color:#8a5a12;
  }
  .warnbox b{color:#c07a10;}
  .warnflag{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
  .mini-toast{
    position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:60;
    background:#2a3038; color:#fff; font-size:13px; border-radius:9px; padding:9px 16px;
    box-shadow:0 4px 14px rgba(29,33,41,.3); white-space:nowrap;
  }
  .passtoast{
    position:absolute; top:14px; left:22px; right:22px; z-index:5;
    background:#2e9e5b; color:#fff; border-radius:10px; padding:10px; text-align:center;
    font-size:13.5px; font-weight:600; box-shadow:0 4px 14px rgba(46,158,91,.4);
  }
  /* ---------- 学习路线模式 ---------- */
  #pmkroad{
    width:100%; padding:10px 0; border-radius:10px; font-size:13px; cursor:pointer;
    border:1.5px solid #eed9b0; background:#fdf6ea; color:#9a6b12; font-weight:600; margin-top:10px;
    transition:all .15s; font-family:inherit;
  }
  #pmkroad:hover{background:#faf0da;}
  .roadhead{font-size:13.5px; color:#7c5410; font-weight:600; line-height:1.6; margin:2px 0 8px;}
  .roadmeta{font-size:11.5px; color:#9aa1ac; margin:0 0 10px;}
  .roadlist{display:flex; flex-direction:column; gap:6px;}
  .step{
    display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:9px;
    background:#f8f9fb; border:1px solid var(--line); cursor:pointer; transition:all .15s;
  }
  .step:hover{border-color:#e3c98f; background:#fffdf7;}
  .step .sno{
    width:22px; height:22px; border-radius:50%; flex:none; font-size:11.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; background:#f3e5c8; color:#8a6a1f;
    font-variant-numeric:tabular-nums;
  }
  .step .sname{font-size:12.8px; color:#2a3038; flex:1; min-width:0;}
  .step .sflag{font-size:10px; color:#b8860b; font-weight:700; white-space:nowrap;}
  .step small{color:#9aa1ac; font-size:10.5px; white-space:nowrap;}
  .step.now{border-color:#e0a92e; background:#fff8e9; box-shadow:0 0 0 2px rgba(224,169,46,.15);}
  .step.now .sno{background:#e0a92e; color:#fff;}
  .step.target{border-style:dashed; border-color:#d9a13c; border-width:1.5px;}
  .step.target .sno{background:var(--ink); color:#fff;}
  #pexitroad{
    width:100%; padding:8px 0; border-radius:9px; font-size:12px; cursor:pointer; margin-top:10px;
    border:1px solid var(--line); background:#fff; color:#6b7280; font-family:inherit;
  }
  #pexitroad:hover{background:#f4f5f8;}
  .node.onroad{opacity:1;}
  .node.onroad rect{stroke-width:2.1; filter:drop-shadow(0 2px 6px rgba(29,33,41,.18));}
  .node.onroad.sel rect{stroke-width:2.6;}
  .edge.onroad{stroke:var(--up); stroke-width:2.3; opacity:.92;}
  @media (max-width:720px){
    #panel{top:auto; height:52vh; width:100%; border-left:0; border-top:1px solid var(--line);}
    #hint{display:none;}
    .searchbox{min-width:0; flex:1;}
    #q{width:100%;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <h1>小学数学知识图谱</h1>
      <p class="sub" id="subtitle">人教版 · 一至六年级 · 加载中…</p>
    </div>
    <div class="progress-block">
      <div class="ptext"><span id="pl">已掌握 0 / 0</span><button class="linkbtn" id="reset">清空</button><button class="linkbtn spot" id="pspot">抽查</button></div>
      <div class="pbar"><div id="pfill"></div></div>
    </div>
  </div>
  <div class="controls">
    <div class="searchbox">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3c4350" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" placeholder="搜索知识点：分数、圆、方程…" autocomplete="off">
      <span id="qcount"></span>
    </div>
    <div class="chips" id="gradeChips"></div>
    <div class="chips" id="domainChips"></div>
  </div>
</header>

<main>
  <div id="hint">点击知识点看「来路 / 去路」 · 小测 3 题全对才算掌握 · 右上「抽查」检验真会不会 · 滚轮缩放 · 拖动平移</div>
  <div class="zoombtns">
    <button id="zin" title="放大">＋</button>
    <button id="zout" title="缩小">－</button>
    <button id="zfit" title="适配全图">⤢</button>
  </div>
  <svg id="graph"></svg>
</main>

<aside id="panel">
  <button id="pclose" title="关闭">✕</button>
  <div id="ptags"></div>
  <h2 id="pname"></h2>
  <div id="pdetails">
    <p id="pdesc"></p>
    <div id="ptip" class="tipbox" style="display:none"></div>
    <div class="sec"><h3><span class="dot up"></span>先要会的（来路）</h3><div id="ppre" class="chiplist"></div></div>
    <div class="sec"><h3><span class="dot down"></span>接着会学（去路）</h3><div id="pnext" class="chiplist"></div></div>
    <div id="pwarn" class="warnbox" style="display:none"></div>
    <button id="plearn">开始小测 · 3 题全对才算掌握</button>
    <button id="punlearn" style="display:none">取消掌握（直接取消勾，不用测）</button>
    <p class="learnhint">3 题一轮、全对才算掌握，错 1 题整轮重来 · 图上双击知识点可快速进入小测</p>
  </div>
  <div id="quizbox" style="display:none"></div>
  <div class="sec" id="proadsec" style="display:none">
    <h3><span class="dot up"></span>学习路线</h3>
    <button id="pmkroad">列出要先补的知识 →</button>
  </div>
  <div id="roadbox" style="display:none"></div>
  <p class="panelnote">依据人教版教材（义务教育课程标准）单元顺序整理，供学习参考。</p>
</aside>

<script>
'use strict';
/* ============ 数据 ============ */
var DOM = {
  num:{name:'数与代数', c:'var(--num)', bg:'var(--num-bg)'},
  geo:{name:'图形与几何', c:'var(--geo)', bg:'var(--geo-bg)'},
  stat:{name:'统计与概率', c:'var(--stat)', bg:'var(--stat-bg)'},
  prac:{name:'综合与实践', c:'var(--prac)', bg:'var(--prac-bg)'}
};
var SEMN = ['一上','一下','二上','二下','三上','三下','四上','四下','五上','五下','六上','六下'];
var SEMF = ['一年级上册','一年级下册','二年级上册','二年级下册','三年级上册','三年级下册','四年级上册','四年级下册','五年级上册','五年级下册','六年级上册','六年级下册'];
var GRADES = ['一年级','二年级','三年级','四年级','五年级','六年级'];

/* i=id n=名称 s=学期(0~11) d=领域 x=描述 t=要点(可选) p=前置知识 */
var N = [
 {i:'shushu', n:'数一数·比多少', s:0, d:'num', desc:'把物体一个一个地数出来，比谁多、谁少、谁同样多——所有数学的起点。', t:'数数时用手指点一个数一个，做到不重不漏。', p:[]},
 {i:'ren15', n:'1~5的认识和加减法', s:0, d:'num', desc:'会读、会写 1~5，理解数的分与合，会算 5 以内的加法和减法。', p:['shushu']},
 {i:'tu01', n:'认识图形(一)·立体', s:0, d:'geo', desc:'认识长方体、正方体、圆柱和球，能叫出名字、摸着分辨形状。', p:[]},
 {i:'ren610', n:'6~10的认识和加减法', s:0, d:'num', desc:'把数扩展到 10，掌握 10 以内的加减法，体会“凑成十”的思想。', p:['ren15']},
 {i:'ren1120', n:'11~20各数的认识', s:0, d:'num', desc:'认识十位和个位，知道 10 个一是 1 个十——数位的起点。', t:'写数时：几个十写在十位，几个一写在个位。', p:['ren610']},
 {i:'zhongbiao', n:'认识钟表', s:0, d:'num', desc:'认识整时和半时，分清钟面上的时针和分针。', p:[]},
 {i:'jinwei', n:'20以内的进位加法', s:0, d:'num', desc:'用凑十法计算 20 以内进位加法，口算要又快又准。', t:'凑十法：看大数，拆小数，凑成十，加剩数。如 9+4 → 9+1+3=13。', p:['ren610','ren1120']},

 {i:'tuiwei', n:'20以内的退位减法', s:1, d:'num', desc:'用破十法、想加算减算 20 以内的退位减法。', t:'破十法：13-9 → 先算 10-9=1，再算 1+3=4。', p:['jinwei']},
 {i:'pingmian', n:'认识图形(二)·平面', s:1, d:'geo', desc:'认识长方形、正方形、三角形、圆和平行四边形，会辨认和拼组图形。', p:['tu01']},
 {i:'fenlei', n:'分类与整理', s:1, d:'stat', desc:'按不同标准给事物分类、整理——统计的起点。', p:['shushu']},
 {i:'ren100', n:'100以内数的认识', s:1, d:'num', desc:'会数、读、写 100 以内的数，理解几个十和几个一。', p:['ren1120']},
 {i:'renminbi', n:'认识人民币', s:1, d:'num', desc:'认识元、角、分，会简单的兑换和购物计算。', t:'1元=10角，1角=10分。', p:['ren100']},
 {i:'jf100a', n:'100以内加减法(一)', s:1, d:'num', desc:'口算两位数加、减整十数和一位数，为笔算做准备。', p:['ren100','tuiwei']},
 {i:'guilv', n:'找规律', s:1, d:'prac', desc:'发现图形和数的简单排列规律，会接着画、接着填。', p:['fenlei']},

 {i:'changdu', n:'长度单位', s:2, d:'geo', desc:'认识厘米和米，会用尺子量线段，建立长度的感觉。', t:'1米=100厘米。量长度：尺的 0 刻度对准起点。', p:['pingmian']},
 {i:'jf100b', n:'100以内加减法(二)', s:2, d:'num', desc:'学会加减法竖式（笔算），这是所有笔算的地基。', t:'笔算三件事：数位对齐，从个位算起，满十进一、退一当十。', p:['jf100a']},
 {i:'jiao', n:'角的初步认识', s:2, d:'geo', desc:'认识角和角的各部分名称，认识直角、锐角、钝角。', p:['pingmian']},
 {i:'cheng1', n:'表内乘法(一)', s:2, d:'num', desc:'理解乘法是“相同加数的加法”，背熟 2~6 的乘法口诀。', p:['ren610','jf100b']},
 {i:'guancha1', n:'观察物体(一)', s:2, d:'geo', desc:'从前后左右不同位置观察物体，知道看到的形状可能不同。', p:['tu01']},

/* 口算类：每次进入小测都随机出新题、随机选项 */
function ri(n){ return Math.floor(Math.random()*n); }
function shuffled(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=ri(i+1); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function numQ(text, ans){
  var vals=[ans, ans+1, ans+2];
  var order=shuffled([0,1,2]);
  return { q:text, o:order.map(function(k){ return ''+vals[k]; }), a:order.indexOf(0) };
}

/* ============ 缩放平移 ============ */
var view={k:1,tx:0,ty:0};
var KMAX=2.2;
function kMin(){ /* 缩放下限=整图可见再留 15% 余量，永远不会缩到看不见 */
  var r=svg.getBoundingClientRect();
  return Math.min((r.width-30)/CW, (r.height-150)/CH, 1.15)*0.85;
}
function clampK(k){ return Math.min(KMAX, Math.max(kMin(), k)); }
function clampView(){ /* 拖动边界：视口内永远至少有一半区域是图，拖不丢 */
  var r=svg.getBoundingClientRect(), vw=r.width, vh=r.height;
  var mw=CW*view.k, mh=CH*view.k;
  if(mw<=vw) view.tx=(vw-mw)/2;
  else view.tx=Math.min(Math.max(view.tx, vw*0.25-mw), vw*0.75);
  if(mh<=vh) view.ty=(vh-mh)/2;
  else view.ty=Math.min(Math.max(view.ty, vh*0.25-mh), vh*0.75);
}
function applyView(){
  world.setAttribute('transform','translate('+view.tx+','+view.ty+') scale('+view.k+')');
}
function fit(){
  var r=svg.getBoundingClientRect();
  view.k = Math.min((r.width-30)/CW, (r.height-150)/CH, 1.15);
  view.tx = (r.width - CW*view.k)/2;
  view.ty = Math.max(18, (r.height - CH*view.k)/2) - 10;
  applyView();
}
svg.addEventListener('wheel', function(ev){
  ev.preventDefault();
  var r=svg.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  var f=Math.exp(-ev.deltaY*0.0016);   /* 按滚动量连续缩放：轻滚轻放、重滚快放 */
  f=Math.min(1.25, Math.max(0.8, f));  /* 单次幅度封顶，触控板惯性也冲不飞 */
  var k2=clampK(view.k*f);
  view.tx=mx-(mx-view.tx)*k2/view.k;
  view.ty=my-(my-view.ty)*k2/view.k;
  view.k=k2; clampView(); applyView();
},{passive:false});

var pan=null, moved=false, ptrs={}, pinch=null;
function ptrDist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
svg.addEventListener('pointerdown', function(ev){
  ptrs[ev.pointerId]={x:ev.clientX, y:ev.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===2){ /* 双指 = 捏合缩放 */
    var a=ptrs[ids[0]], b=ptrs[ids[1]];
    pinch={d:ptrDist(a,b), mx:(a.x+b.x)/2, my:(a.y+b.y)/2, k0:view.k, tx0:view.tx, ty0:view.ty};
    pan=null; moved=true; svg.classList.add('panning');
  }else if(!pinch){
    pan={x:ev.clientX, y:ev.clientY, tx:view.tx, ty:view.ty}; moved=false;
  }
  // 注意：不能在这里 setPointerCapture——那会把后续 click 也重定向到 svg，
  // 导致节点的 click 监听收不到事件（真实点击无反应）。只在真正拖动/双指后捕获。
});
svg.addEventListener('pointermove', function(ev){
  if(ptrs[ev.pointerId]) ptrs[ev.pointerId]={x:ev.clientX, y:ev.clientY};
  if(pinch){
    var ids=Object.keys(ptrs);
    if(ids.length<2) return;
    var a=ptrs[ids[0]], b=ptrs[ids[1]];
    var d=ptrDist(a,b), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
    var k2=clampK(pinch.k0*d/pinch.d);
    view.tx=mx-(pinch.mx-pinch.tx0)*k2/pinch.k0;
    view.ty=my-(pinch.my-pinch.ty0)*k2/pinch.k0;
    view.k=k2; clampView(); applyView();
    return;
  }
  if(!pan) return;
  var dx=ev.clientX-pan.x, dy=ev.clientY-pan.y;
  if(Math.abs(dx)+Math.abs(dy)>5){
    moved=true; svg.classList.add('panning');
    if(pan.pointerId===undefined) pan.pointerId=ev.pointerId;
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
  }
  view.tx=pan.tx+dx; view.ty=pan.ty+dy;
  if(moved) clampView();
  applyView();
});
function endPointer(ev){
  delete ptrs[ev.pointerId];
  if(pinch && Object.keys(ptrs).length<2) pinch=null;
  if(pan && !moved){
    if(ev.target === svg || ev.target.parentNode === gBG) clearSel();
  }
  try{ svg.releasePointerCapture(ev.pointerId); }catch(e){}
  pan=null; svg.classList.remove('panning');
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);

  var r=svg.getBoundingClientRect();
  var k2=clampK(view.k*f);
  var mx=r.width/2, my=r.height/2;
  view.tx=mx-(mx-view.tx)*k2/view.k; view.ty=my-(my-view.ty)*k2/view.k; view.k=k2;
  clampView(); applyView();
}
function centerNode(n){
  var r=svg.getBoundingClientRect();
  var k2=Math.max(view.k, 1);
  view.k=k2;
  view.tx = r.width/2 - (n.x+W/2)*k2;
  view.ty = Math.max(20, r.height/2 - n.cy*k2);
  applyView();
}

/* ============ 选择 / 过滤 ============ */
function ancestors(id, set){
  byId[id].p.forEach(function(pid){
    if(!set[pid]){ set[pid]=1; ancestors(pid,set); }
  });
  return set;
}
function descendants(id, set){
  kids[id].forEach(function(c){
    if(!set[c.i]){ set[c.i]=1; descendants(c.i,set); }
  });
  return set;
}
function matches(n){
  if(state.grade!==null && Math.floor(n.s/2)!==state.grade) return false;
  if(state.domain!==null && n.d!==state.domain) return false;
  if(state.query && n.n.indexOf(state.query)<0 && n.desc.indexOf(state.query)<0) return false;
  return true;
}
function apply(){
  var anyFilter = state.grade!==null || state.domain!==null || !!state.query;
  var up={}, down={};
  var road = state.road ? (state.roadSet||{}) : null;
  if(state.sel && !road){ ancestors(state.sel.i,up); descendants(state.sel.i,down); }
  N.forEach(function(n){
    var cls='node';
    if(road){
      if(road[n.i]){ cls+=' onroad'; if(n.i===state.road) cls+=' sel'; }
      else cls+=' dim';
    }else{
      var ok = matches(n);
      if(anyFilter && !ok) cls+=' dim';
      if(state.sel){
        if(n.i===state.sel.i) cls+=' sel';
        else if(up[n.i]) cls+=' up';
        else if(down[n.i]) cls+=' down';
        else cls+=' fade';
      }
    }
    n.g.setAttribute('class', cls);
  });
  E.forEach(function(e){
    var cls='edge';
    if(road){
      if(road[e.a.i] && road[e.b.i]) cls+=' onroad';
      else cls+=' dim';
    }else{
      var okA=matches(e.a), okB=matches(e.b);
      if(anyFilter && !(okA&&okB)) cls+=' dim';
      if(state.sel){
        var aIn = e.a.i===state.sel.i || up[e.a.i];
        var bIn = e.b.i===state.sel.i || up[e.b.i];
        var aDn = e.a.i===state.sel.i || down[e.a.i];
        var bDn = e.b.i===state.sel.i || down[e.b.i];
        if(aIn&&bIn) cls+=' up';
        else if(aDn&&bDn) cls+=' down';
        else cls+=' fade';
      }
    }
    e.el.setAttribute('class', cls);
  });
  updateProgress();
}
function updateProgress(){
  var c=0; N.forEach(function(n){ if(learned[n.i])c++; });
  document.getElementById('pl').textContent='已掌握 '+c+' / '+N.length;
  document.getElementById('pfill').style.width=(c/N.length*100)+'%';
}

var QSTATE=null; /* {node, qs:[题目], idx, wrongs} */
function getQuiz(n){
  var gen = QGEN[n.i];
  if(gen) return gen();
  return (QZ[n.i]||[]).slice();
}
function startQuiz(n){
  var qs = getQuiz(n);
  if(!qs || !qs.length){ markLearned(n); return; } /* 无题库则退回直接标记（不应发生） */

  var order=shuffled([0,1,2]);
  var html='<div class="quizhead"><span class="qt">掌握小测 · '+s.node.n+'</span><span class="qprog">第 '+(s.idx+1)+' / '+s.qs.length+' 题</span></div>';

  });

    btn.onclick=function(){ pickOpt(btn, qq); };

}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function pickOpt(btn, qq){
  var s=QSTATE; if(!s) return;
  var k=parseInt(btn.getAttribute('data-k'),10);

      if(QSTATE!==mine) return; /* 用户已切换知识点或退出小测 */
      QSTATE.idx++;
      if(QSTATE.idx>=QSTATE.qs.length) finishQuiz();
      else renderQuiz();
    }, 650);
  }else{
    btn.classList.add('wrong');
    document.getElementById('qfeed').innerHTML='<span class="no">✗ 差一点。3 题一轮全对才算，重新开始吧</span><button class="retrybtn" id="qretry">重新小测</button>';

function miniToast(msg){
  var t=document.createElement('div'); t.className='mini-toast'; t.textContent=msg;

}
function startSpot(){

  var pick=shuffled(pool).slice(0,5);
  SPOT={ qs: pick.map(function(n){
      var q=getQuiz(n); q=shuffled(q);

    }), idx:0, right:0, done:false };

function pickSpot(btn, qq){
  var s=SPOT; if(!s || s.done) return;
  var k=parseInt(btn.getAttribute('data-k'),10);
  var opts=document.querySelectorAll('#quizbox .qopt');
  var correct=(k===qq.a);
  Array.prototype.forEach.call(opts, function(b){
    b.disabled=true;
    var bk=parseInt(b.getAttribute('data-k'),10);
    if(bk===qq.a) b.classList.add('right');
  });
  var feed=document.getElementById('qfeed');
  var cnode=s.qs[s.idx].node;
  s.qs[s.idx].ok=correct; /* 记进成绩单 */
  /* 虚掌握记账：答对清零；答错 +1（不动勾） */
  if(correct){ delete spotMiss[cnode.i]; }
  else{ spotMiss[cnode.i]=(spotMiss[cnode.i]||0)+1; }
  saveSpot();
  updateBadge(cnode);
  if(correct){
    s.right++;
    feed.innerHTML='<span class="ok">✓ 答对了</span>';
    var mine=SPOT;
    setTimeout(function(){
      if(SPOT!==mine || SPOT.done) return;

    btn.classList.add('wrong');
    feed.innerHTML='<span class="no">✗ 答错了</span><span style="font-size:11.5px;color:#9aa1ac">（抽查不打勾也不取消勾，只看真不真会）</span>';
    var mine=SPOT;
    setTimeout(function(){
      if(SPOT!==mine || SPOT.done) return; /* 用户已退出抽查 */
      midGoSpot();
    }, 1400);
  }
}

function buildRoad(n){
  state.road=n.i;
  var anc={}; ancestors(n.i,anc);
  var set={}; set[n.i]=1;
  for(var k in anc) set[k]=1;
  state.roadSet=set;

  document.getElementById('proadsec').style.display='none';
  var box=document.getElementById('roadbox'); box.style.display='block';
  var all=Object.keys(set).map(function(id){ return byId[id]; });
  var todo=all.filter(function(m){ return !learned[m.i]; });
  todo.sort(function(a,b){ return (a.s-b.s)||(a.row-b.row); });
  var done=all.length-todo.length;
  var html='';
  if(learned[n.i]){
    html+='<div class="roadhead">🎉 「'+n.n+'」已经掌握！</div>';
    html+='<div class="roadmeta">路线完成。退出后点击它，可以看看接下来能学什么。</div>';

    if(done>0) html+='<div class="roadmeta">✓ 已具备 '+done+' 个基础，自动跳过</div>';
    html+='<div class="roadlist">';
    todo.forEach(function(m,idx){
      var isT=(m.i===n.i), isFirst=(idx===0 && !isT);
      var cls='step'+(isT?' target':'')+(isFirst?' now':'');
      var flag=isT?'★ 目标':(isFirst?'现在学':'');
      html+='<div class="'+cls+'" data-id="'+m.i+'"><span class="sno">'+(idx+1)+'</span><span class="sname">'+m.n+'</span>'+(flag?'<span class="sflag">'+flag+'</span>':'')+'<small>'+SEMN[m.s]+'</small></div>';
    });

  html+='<button id="pexitroad">退出路线模式</button>';

    if(first){ select(first,true); panel.classList.add('open'); }
  }
});
document.getElementById('reset').onclick=function(){
  if(confirm('确定清空所有「已掌握」标记吗？')){
    learned={}; spotMiss={}; saveLearned(); saveSpot();
    N.forEach(updateBadge);
    if(state.sel) renderLearnBtn();
    if(state.road) refreshRoad();
    apply();
  }
};

/* ============ 启动 ============ */
document.getElementById('subtitle').textContent =
  '人教版 · 一至六年级 · '+N.length+' 个知识点 · '+E.length+' 条前后衔接 · 点击知识点看「来龙去脉」';
updateProgress();
fit();
apply();
window.addEventListener('resize', function(){ svg.setAttribute('viewBox','0 0 '+window.innerWidth+' '+window.innerHeight); });
</script>
</body>
</html>
